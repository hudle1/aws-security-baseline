# Dependabot opens a PR when a dependency has a new version. Each PR runs the full CI,
# so a bump is merged only if the checks stay green. Nothing is auto-merged.
version: 2
updates:
  # Action versions. Dependabot understands the "# vX.Y.Z" comment after a pinned SHA and
  # updates both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # AWS provider (and random) versions and their .terraform.lock.hcl hashes, per stack.
  - package-ecosystem: terraform
    directory: /infra/guardrails
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
  - package-ecosystem: terraform
    directory: /infra/baseline
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  # Pinned checkov version in .github/ci/requirements.txt.
  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
